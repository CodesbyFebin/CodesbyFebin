<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="100+ technical articles on STARK proofs, self-hosted systems, AI infrastructure, and open-source development.">
    <meta property="og:title" content="Blog — CodesbyFebin">
    <meta property="og:description" content="Deep dives into verifiable compute, sovereign systems, and AI infrastructure. 50 high-traffic articles + 50 community guides.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://codesbyfebin.vercel.app/blog/">
    <meta property="og:image" content="https://codesbyfebin.vercel.app/assets/og-blog-1200x630.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@codesbyfebin">
    <link rel="canonical" href="https://codesbyfebin.vercel.app/blog/">
    <title>Blog — CodesbyFebin | 100+ Technical Articles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d46a;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --border: #2d2d2d;
        }

        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: var(--dark-bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .blog-stats {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            color: var(--primary);
            font-weight: bold;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            font-family: 'Monaco', 'Courier New', monospace;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--primary);
            color: var(--primary);
        }

        .search-box {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 24px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s;
        }

        .post-card:hover {
            border-color: var(--primary);
        }

        .post-card:hover::before {
            transform: scaleX(1);
        }

        .post-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .post-category {
            background: rgba(0, 212, 106, 0.1);
            color: var(--primary);
            padding: 4px 8px;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
        }

        .post-type {
            background: rgba(160, 160, 160, 0.1);
            color: var(--text-muted);
            padding: 4px 8px;
            font-size: 0.75em;
            border-radius: 2px;
        }

        .post-date {
            color: var(--text-muted);
            font-size: 0.85em;
        }

        .post-title {
            font-size: 1.3em;
            margin: 12px 0;
            color: var(--text);
            text-decoration: none;
            display: block;
            transition: color 0.3s;
        }

        .post-title:hover {
            color: var(--primary);
        }

        .post-excerpt {
            color: var(--text-muted);
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .read-time {
            display: flex;
            gap: 8px;
        }

        .difficulty {
            padding: 2px 6px;
            background: rgba(0, 212, 106, 0.05);
            border-radius: 2px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
        }

        .pagination a,
        .pagination span {
            padding: 8px 12px;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            transition: all 0.3s;
        }

        .pagination a:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination .active {
            background: var(--primary);
            color: var(--dark-bg);
            border-color: var(--primary);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }

            .blog-stats {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>> blog</h1>
            <p style="color: var(--text-muted); margin-top: 10px;">Deep dives into systems engineering, cryptography, and open-source</p>
            
            <div class="blog-stats">
                <div class="stat">
                    <div class="stat-number">100+</div>
                    <div class="stat-label">Articles</div>
                </div>
                <div class="stat">
                    <div class="stat-number">50</div>
                    <div class="stat-label">High-Traffic Topics</div>
                </div>
                <div class="stat">
                    <div class="stat-number">50</div>
                    <div class="stat-label">UGC Guides</div>
                </div>
                <div class="stat">
                    <div class="stat-number">1K+</div>
                    <div class="stat-label">Min Read Time</div>
                </div>
            </div>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search 100 articles..." />
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Posts</button>
            <button class="filter-btn" data-filter="Verifiable Compute">Verifiable Compute</button>
            <button class="filter-btn" data-filter="Self-Hosted Systems">Self-Hosted</button>
            <button class="filter-btn" data-filter="AI Infrastructure">AI Infrastructure</button>
            <button class="filter-btn" data-filter="Backend">Backend</button>
            <button class="filter-btn" data-filter="DevOps">DevOps</button>
            <button class="filter-btn" data-filter="Tutorial">Tutorials</button>
            <button class="filter-btn" data-filter="Case Study">Case Studies</button>
        </div>

        <div class="posts-grid" id="postsGrid">
            <!-- Posts loaded by JavaScript -->
        </div>

        <div class="pagination" id="pagination">
            <!-- Pagination controls -->
        </div>
    </div>

    <script>
        let allPosts = [];
        let filteredPosts = [];
        const postsPerPage = 12;
        let currentPage = 1;
        let currentFilter = 'all';
        let searchTerm = '';

        // Load blog posts from JSON
        async function loadPosts() {
            try {
                const response = await fetch('/data/blog-posts.json');
                const data = await response.json();
                allPosts = data.posts;
                renderPosts();
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('postsGrid').innerHTML = '<p>Error loading posts</p>';
            }
        }

        function filterPosts() {
            filteredPosts = allPosts.filter(post => {
                const matchesCategory = currentFilter === 'all' || post.category === currentFilter || post.type === currentFilter;
                const matchesSearch = searchTerm === '' || 
                    post.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    post.excerpt.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    post.tags.some(tag => tag.toLowerCase().includes(searchTerm.toLowerCase()));
                
                return matchesCategory && matchesSearch;
            });
            
            currentPage = 1;
            renderPosts();
        }

        function renderPosts() {
            const start = (currentPage - 1) * postsPerPage;
            const end = start + postsPerPage;
            const postsToShow = filteredPosts.slice(start, end);

            const html = postsToShow.map(post => `
                <div class="post-card">
                    <div class="post-meta">
                        <span class="post-category">${post.category}</span>
                        ${post.type ? `<span class="post-type">${post.type}</span>` : ''}
                        <span class="post-date">${new Date(post.date).toLocaleDateString()}</span>
                    </div>
                    <a href="/blog/${post.slug}/" class="post-title">${post.title}</a>
                    <p class="post-excerpt">${post.excerpt}</p>
                    <div class="post-footer">
                        <div class="read-time">
                            <span>${post.readTime} min read</span>
                        </div>
                        <span class="difficulty">${post.difficulty}</span>
                    </div>
                </div>
            `).join('');

            document.getElementById('postsGrid').innerHTML = html || '<p>No posts found</p>';
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredPosts.length / postsPerPage);
            let paginationHtml = '';

            if (currentPage > 1) {
                paginationHtml += `<a href="#">← Previous</a>`;
            }

            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    paginationHtml += `<span class="active">${i}</span>`;
                } else {
                    paginationHtml += `<a href="#" data-page="${i}">${i}</a>`;
                }
            }

            if (currentPage < totalPages) {
                paginationHtml += `<a href="#">Next →</a>`;
            }

            document.getElementById('pagination').innerHTML = paginationHtml;

            // Add click handlers
            document.querySelectorAll('[data-page]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPage = parseInt(btn.dataset.page);
                    renderPosts();
                    window.scrollTo(0, 0);
                });
            });
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                filterPosts();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            filterPosts();
        });

        // Load posts on page load
        loadPosts();
    </script>
</body>
</html>
